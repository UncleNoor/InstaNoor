<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' https: data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send a GIF</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="gif-picker.css">
</head>
<body>
  <header class="bar">
    <input id="q" type="search" placeholder="Search GIFs" aria-label="Search GIFs" autofocus>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-trending" aria-selected="true">Trending</button>
      <button role="tab" id="tab-recent" aria-selected="false">Recent</button>
    </nav>
  </header>
  <main id="grid" class="grid" aria-live="polite"></main>
  <div id="status" class="status muted"></div>
  <footer class="foot muted"><span id="powered"></span><span class="spacer"></span><span>Esc to close</span></footer>
  <script src="gif-picker.js"></script>
</body>
</html>
