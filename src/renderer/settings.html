<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InstaNoor Settings</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="wrap">
    <header class="row head">
      <h1>InstaNoor</h1>
      <span class="spacer"></span>
      <button id="open-follow">Follower Tracker</button>
      <button id="open-downloads">Downloads</button>
    </header>
    <section class="stats card" aria-label="This session">
      <div><strong id="stat-ads">0</strong><span class="muted">ads blocked</span></div>
      <div><strong id="stat-tracking">0</strong><span class="muted">trackers blocked</span></div>
      <div><strong id="stat-seen">0</strong><span class="muted">"seen" receipts hidden</span></div>
      <div><strong id="stat-today">0m</strong><span class="muted">on Instagram today</span></div>
    </section>
    <form id="form" autocomplete="off"></form>
    <p class="muted small">Changes apply instantly. Instagram changes its website often: if a feature stops working, check for an InstaNoor update.</p>
  </main>
  <script src="settings.js"></script>
</body>
</html>
