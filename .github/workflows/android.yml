name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unit tests
        run: npm test

      # Optional: add the repository secrets INSTANOOR_KEYSTORE_BASE64,
      # INSTANOOR_STORE_PASSWORD, INSTANOOR_KEY_ALIAS and INSTANOOR_KEY_PASSWORD to
      # sign with your own key, so new builds install as updates.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.INSTANOOR_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/instanoor-release.jks
          echo "INSTANOOR_STORE_FILE=instanoor-release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          INSTANOOR_STORE_PASSWORD: ${{ secrets.INSTANOOR_STORE_PASSWORD }}
          INSTANOOR_KEY_ALIAS: ${{ secrets.INSTANOOR_KEY_ALIAS }}
          INSTANOOR_KEY_PASSWORD: ${{ secrets.INSTANOOR_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: InstaNoor-apk
          path: android/app/build/outputs/apk/release/*.apk
